<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Melody Audio</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #1e1e1e; color: #e0e0e0; }
    body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; }
    #mel-start { font-size: 1.25rem; padding: 0.75rem 2rem; border: 1px solid #555; border-radius: 0.5rem; background: #2d2d2d; color: #e0e0e0; cursor: pointer; }
    #mel-start:hover { background: #3a3a3a; }
    #mel-start:disabled { opacity: 0.5; cursor: default; }
    #mel-status { margin-top: 1rem; font-size: 0.9rem; color: #9a9a9a; }
    #mel-log { margin-top: 1.5rem; width: 90%; max-width: 720px; height: 240px; overflow: auto; background: #141414; border: 1px solid #333; border-radius: 0.5rem; padding: 0.5rem 0.75rem; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.8rem; white-space: pre-wrap; }
  </style>
</head>
<body>
  <button id="mel-start">click to start audio</button>
  <div id="mel-status">audio context requires a user gesture</div>
  <pre id="mel-log"></pre>
  <script>
    var melLog = document.getElementById("mel-log");
    var melStatus = document.getElementById("mel-status");
    var melStart = document.getElementById("mel-start");
    function melAppend(text) {
      melLog.textContent += text + "\n";
      melLog.scrollTop = melLog.scrollHeight;
    }
    var Module = {
      noInitialRun: true,
      print: melAppend,
      printErr: melAppend,
      onRuntimeInitialized: function () {
        melStatus.textContent = "ready";
        melStart.disabled = false;
      }
    };
    melStart.disabled = true;
    melStart.addEventListener("click", function () {
      melStart.disabled = true;
      melStatus.textContent = "running";
      try {
        Module.callMain([]);
      } catch (e) {
        melStatus.textContent = "error";
        melAppend("" + e);
      }
    });
  </script>
  {{{ SCRIPT }}}
</body>
</html>
